AWSTemplateFormatVersion: '2010-09-09'
Description: 'DbMoto XML to Gluesync YAML Converter API'

Parameters:
  FtpHost:
    Type: String
    Description: 'FTP hostname (e.g., c1107198.sgvps.net)'
    NoEcho: true

  FtpUser:
    Type: String
    Description: 'FTP username'
    NoEcho: true

  FtpPassword:
    Type: String
    NoEcho: true
    Description: 'FTP password'

  FtpBasePath:
    Type: String
    Default: '/molo17.com/public_html/gs-content/dbmoto-conversion/'
    Description: 'Legacy SiteGround FTP base path (used only when DualWriteSg=1)'

  DownloadsS3Bucket:
    Type: String
    Default: 'molo17-website-downloads-162172359273'
    Description: 'S3 downloads bucket for conversion artifacts (primary publish target)'

  DownloadsS3Prefix:
    Type: String
    Default: 'gs-content/dbmoto-conversion'
    Description: 'S3 key prefix for DbMoto conversion artifacts (no leading/trailing slash required)'

  DualWriteSg:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
    Description: 'Also write to SiteGround FTP when 1 (default S3-only)'

  CustomDomainName:
    Type: String
    Default: 'dbmoto-converter.labs.molo17.com'
    Description: 'Custom domain name for the API Gateway'

Resources:
  # FTP configuration will be passed via environment variables

  # Lambda execution role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DbmotoConverterSQSDynamoPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt JobsQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:aws:s3:::${DownloadsS3Bucket}'
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub '${DownloadsS3Prefix}'
                      - !Sub '${DownloadsS3Prefix}/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub 'arn:aws:s3:::${DownloadsS3Bucket}/${DownloadsS3Prefix}/*'

  # Lambda function
  ConversionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dbmoto-xml-converter
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': 'Placeholder - will be updated'}
      Environment:
        Variables:
          FTP_HOST: !Ref FtpHost
          FTP_USER: !Ref FtpUser
          FTP_PASSWORD: !Ref FtpPassword
          FTP_BASE_PATH: !Ref FtpBasePath
          DOWNLOADS_S3_BUCKET: !Ref DownloadsS3Bucket
          DOWNLOADS_S3_PREFIX: !Ref DownloadsS3Prefix
          DUAL_WRITE_SG: !Ref DualWriteSg
          SQS_QUEUE_URL: !Ref JobsQueue
          DDB_TABLE_NAME: !Ref JobsTable
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 1024

  # API Gateway
  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: dbmoto-xml-converter-api
      Description: API for converting DbMoto XML to Gluesync YAML
      BinaryMediaTypes:
        - multipart/form-data
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway resource
  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: convert

  # API Gateway method (POST /convert -> submit job)
  ApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConversionLambda.Arn}/invocations'

  # API Gateway method (GET /convert -> job status)
  ApiMethodGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConversionLambda.Arn}/invocations'

  # API Gateway deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiMethod
      - ApiMethodGet
    Properties:
      RestApiId: !Ref ApiGateway
      StageName: prod

  # SSL Certificate for custom domain
  ApiGatewayCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref CustomDomainName
      ValidationMethod: DNS

  # Custom domain for API Gateway
  ApiGatewayCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref CustomDomainName
      RegionalCertificateArn: !Ref ApiGatewayCertificate
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Map custom domain to API Gateway stage
  ApiGatewayBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn: ApiGatewayCustomDomain
    Properties:
      DomainName: !Ref ApiGatewayCustomDomain
      RestApiId: !Ref ApiGateway
      Stage: prod

  # Lambda permission for API Gateway
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConversionLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*'

  # SQS queue for conversion jobs
  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dbmoto-xml-converter-jobs
      VisibilityTimeout: 900

  # DynamoDB table for job status tracking
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dbmoto-xml-converter-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  # Event source mapping from SQS to Lambda (worker processing)
  JobsQueueEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt JobsQueue.Arn
      FunctionName: !Ref ConversionLambda
      BatchSize: 1
      Enabled: true

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod'

  CustomDomainEndpoint:
    Description: Custom domain endpoint URL
    Value: !Sub 'https://${CustomDomainName}'

  RegionalDomainName:
    Description: Regional domain name for DNS CNAME record
    Value: !GetAtt ApiGatewayCustomDomain.RegionalDomainName

  CertificateArn:
    Description: SSL certificate ARN
    Value: !Ref ApiGatewayCertificate

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !Ref ConversionLambda

  FtpBasePath:
    Description: Legacy SiteGround FTP base path (DualWriteSg only)
    Value: !Ref FtpBasePath
  DownloadsS3Bucket:
    Description: S3 downloads bucket for conversion artifacts
    Value: !Ref DownloadsS3Bucket
  DownloadsS3Prefix:
    Description: S3 key prefix for DbMoto conversion artifacts
    Value: !Ref DownloadsS3Prefix

  JobsQueueUrl:
    Description: URL of the SQS queue used for async conversion jobs
    Value: !Ref JobsQueue

  JobsTableName:
    Description: Name of the DynamoDB table used for job status tracking
    Value: !Ref JobsTable
