AWSTemplateFormatVersion: '2010-09-09'
Description: 'DbMoto XML to Gluesync YAML Converter API'

Parameters:
  FtpHost:
    Type: String
    Description: 'FTP hostname (e.g., c1107198.sgvps.net)'
    NoEcho: true

  FtpUser:
    Type: String
    Description: 'FTP username'
    NoEcho: true

  FtpPassword:
    Type: String
    NoEcho: true
    Description: 'FTP password'

  FtpBasePath:
    Type: String
    Default: '/molo17.com/public_html/gs-content/dbmoto-conversion/'
    Description: 'Base path on FTP server for uploads'

  CustomDomainName:
    Type: String
    Default: 'dbmoto-converter.labs.molo17.com'
    Description: 'Custom domain name for the API Gateway'

Resources:
  # FTP configuration will be passed via environment variables

  # Lambda execution role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda function
  ConversionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dbmoto-xml-converter
      Runtime: python3.9
      Handler: lambda_function.lambda_handler
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': 'Placeholder - will be updated'}
      Environment:
        Variables:
          FTP_HOST: !Ref FtpHost
          FTP_USER: !Ref FtpUser
          FTP_PASSWORD: !Ref FtpPassword
          FTP_BASE_PATH: !Ref FtpBasePath
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 1024

  # API Gateway
  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: dbmoto-xml-converter-api
      Description: API for converting DbMoto XML to Gluesync YAML
      BinaryMediaTypes:
        - multipart/form-data
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway resource
  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: convert

  # API Gateway method
  ApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConversionLambda.Arn}/invocations'

  # API Gateway deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ApiMethod
    Properties:
      RestApiId: !Ref ApiGateway
      StageName: prod

  # SSL Certificate for custom domain
  ApiGatewayCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref CustomDomainName
      ValidationMethod: DNS

  # Custom domain for API Gateway
  ApiGatewayCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref CustomDomainName
      RegionalCertificateArn: !Ref ApiGatewayCertificate
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Map custom domain to API Gateway stage
  ApiGatewayBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn: ApiGatewayCustomDomain
    Properties:
      DomainName: !Ref ApiGatewayCustomDomain
      RestApiId: !Ref ApiGateway
      Stage: prod

  # Lambda permission for API Gateway
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConversionLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*'

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod'

  CustomDomainEndpoint:
    Description: Custom domain endpoint URL
    Value: !Sub 'https://${CustomDomainName}'

  RegionalDomainName:
    Description: Regional domain name for DNS CNAME record
    Value: !GetAtt ApiGatewayCustomDomain.RegionalDomainName

  CertificateArn:
    Description: SSL certificate ARN
    Value: !Ref ApiGatewayCertificate

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !Ref ConversionLambda

  FtpBasePath:
    Description: Base path for FTP uploads
    Value: !Ref FtpBasePath
