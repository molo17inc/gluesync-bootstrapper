# ElasticMQ for the Azure mirror of dbmoto-xml-converter (app dbmoto-xml-converter-sqs).
# Lives on the Azure Files share "dbmoto-sqs" (mounted at /data) next to the H2 message store, so queued jobs
# survive restarts. Copy it there after a change:  az storage file upload --account-name stmolo17drmq -s dbmoto-sqs --source elasticmq.conf
include classpath("application.conf")

node-address {
  protocol = http
  host = "dbmoto-xml-converter-sqs"
  port = 80
  context-path = ""
}
generate-node-address = false

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}
rest-stats.enabled = false

aws {
  region = eu-central-1
  accountId = 162172359273
}

# Same settings as the AWS queue (VisibilityTimeout 900 s = the Lambda timeout, 4 days retention).
queues {
  dbmoto-xml-converter-jobs {
    defaultVisibilityTimeout = 900 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
}

messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq-messages"
}
