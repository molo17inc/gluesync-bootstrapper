<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gluesync Automator</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="/static/gluesync-bootstrapper.svg" alt="Gluesync Automator" class="brand-logo" />
        <span>Gluesync Automator</span>
      </div>
      <div class="topbar-links">
        <a href="https://docs.molo17.com" target="_blank" rel="noopener" class="topbar-link">Documentation</a>
        <a href="https://support.molo17.com" target="_blank" rel="noopener" class="topbar-link">Support</a>
        <div id="status-indicator" class="status status-idle">Idle</div>
      </div>
    </header>

    <main class="layout">
      <section class="card" id="auth-card">
        <h2>Authentication</h2>
        <form id="login-form" class="form-grid">
          <label>
            CoreHub URL
            <input type="text" id="corehub-url" name="corehubUrl" placeholder="https://localhost" required />
          </label>
          <label>
            Username
            <input type="text" id="username" name="username" required />
          </label>
          <label>
            Password
            <input type="password" id="password" name="password" required />
          </label>
          <fieldset class="fieldset">
            <legend>Security</legend>
            <label class="checkbox">
              <input type="checkbox" id="use-ssl" checked />
              Enable TLS
            </label>
            <label class="checkbox">
              <input type="checkbox" id="skip-verify" checked />
              Skip certificate verification
            </label>
          </fieldset>
          <fieldset class="fieldset">
            <legend>Preferences</legend>
            <label class="checkbox">
              <input type="checkbox" id="enable-scheduling" checked />
              Enable scheduling
            </label>
            <label class="checkbox">
              <input type="checkbox" id="create-tables" checked />
              Create missing tables
            </label>
          </fieldset>
          <button type="submit" class="primary">Sign in</button>
          <button type="button" id="logout-btn" class="secondary" disabled>Sign out</button>
        </form>
        <div id="auth-message" class="message"></div>
      </section>

      <section class="card" id="config-card">
        <h2>Import (create entities from YAML)</h2>
        <form id="config-form" class="form-grid">
          <label>
            Pipeline ID
            <input type="text" id="pipeline-id" name="pipelineId" required />
          </label>
          <label>
            Source schema
            <input type="text" id="source-schema" name="sourceSchema" required />
          </label>
          <label>
            Target schema
            <input type="text" id="target-schema" name="targetSchema" required />
          </label>
          <label>
            Source type
            <input type="text" id="source-type" name="sourceType" placeholder="SQL" required />
          </label>
          <label>
            Target type
            <input type="text" id="target-type" name="targetType" placeholder="NoSQL" required />
          </label>
          <label>
            Chunk size
            <input type="number" id="chunk-size" name="chunkSize" value="50" min="1" max="500" />
          </label>
          <label>
            YAML configuration
            <input type="file" id="yaml-file" accept=".yaml,.yml" />
          </label>
          <label class="checkbox">
            <input type="checkbox" id="skip-errors" />
            Skip errors
          </label>
          <button type="submit" class="primary" disabled id="run-btn">Start entity creation</button>
        </form>
        <div id="config-message" class="message"></div>
      </section>

      <section class="card" id="export-card">
        <h2>Export (backup pipeline configuration)</h2>
        <form id="export-form" class="form-grid">
          <label>
            Pipeline
            <select id="export-pipeline-id" name="pipelineId">
              <option value="">Select a pipeline…</option>
            </select>
          </label>
          <div class="button-group">
            <button type="submit" class="secondary" id="export-btn" disabled>Download YAML</button>
            <button type="button" class="secondary" id="export-all-btn" disabled>Export All</button>
          </div>
        </form>
        <div id="export-message" class="message"></div>
      </section>

      <section class="card log-card">
        <h2>Execution log</h2>
        <div id="log-output" class="log-output"></div>
      </section>
    </main>

    <footer class="footer">&copy; <span id="footer-year"></span> MOLO17. All rights reserved.</footer>

    <template id="log-line-template">
      <div class="log-line"></div>
    </template>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
