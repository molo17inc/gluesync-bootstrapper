image: gradle:8.8-jdk21

stages:
  - test
  - build
  - publish
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  GIT_DEPTH: "1"
  GIT_STRATEGY: "fetch"

workflow:
  rules:
    - if: '$PIPELINE_TYPE == "build_and_deploy"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null'
      when: always
    - when: never
  name: "$PIPELINE_DESCRIPTION"

build_test_all:
  stage: test
  retry: 2
  tags:
    - hq-linux-docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null'
  script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
    - gradle check
  interruptible: true

build_gluesync_core_hub:
  stage: build
  retry: 2
  tags:
    - hq-linux-docker
  rules:
    - if: '$PIPELINE_TYPE == "build_and_deploy" && $MODULE == "core-hub"'
  script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
    - mkdir libs
    - gradle :corehub:obfuscateWithProguard
    - find . -type f -name gluesync-*.jar -path '*/build/*' -exec cp '{}' libs/ \;
  artifacts:
    paths:
      - libs/*
    expire_in: 1 day
  interruptible: true

publish_gluesync_core_hub:
  stage: publish
  retry: 2
  tags:
    - hq-linux-docker
  rules:
    - if: '$PIPELINE_TYPE == "build_and_deploy" && $MODULE == "core-hub"'
  script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
    - apt-get update && apt-get install -y gnupg zip curl
    - echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
    - |
      if [ -z "$MODULE_VERSION" ]; then
        echo "MODULE_VERSION is not set. Ensure the pipeline is triggered with module version." >&2
        exit 1
      fi
      export VERSION="$MODULE_VERSION"
    - RELEASE_VERSION="$VERSION" gradle -Psigning.gnupg.keyName="$GPG_KEY_ID" -Psigning.gnupg.passphrase="$GPG_PASSPHRASE" :corehub:publishToMavenLocal
    - ARTIFACT_DIR="${HOME}/.m2/repository/com/molo17/gluesync/gluesync-core-hub/$VERSION"
    - |
      if [ ! -d "$ARTIFACT_DIR" ]; then
        echo "Artifacts not found in $ARTIFACT_DIR" >&2
        exit 1
      fi
    - mkdir -p /tmp/bundle/com/molo17/gluesync/gluesync-core-hub/$VERSION
    - cp $ARTIFACT_DIR/* /tmp/bundle/com/molo17/gluesync/gluesync-core-hub/$VERSION/
    - cd /tmp/bundle/com/molo17/gluesync/gluesync-core-hub/$VERSION
    - |
      for file in *.jar *.pom; do
        if [ -f "$file" ]; then
          md5sum "$file" | awk '{print $1}' > "${file}.md5"
          sha1sum "$file" | awk '{print $1}' > "${file}.sha1"
        fi
      done
    - cd /tmp/bundle && zip -r /tmp/gluesync-core-hub-bundle.zip com/
    - export AUTH_TOKEN=$(printf "${SONATYPE_USERNAME}:${SONATYPE_PASSWORD}" | base64)
    - |
      curl --fail --request POST \
        --header "Authorization: Bearer ${AUTH_TOKEN}" \
        --form bundle=@/tmp/gluesync-core-hub-bundle.zip \
        --form publishingType=AUTOMATIC \
        https://central.sonatype.com/api/v1/publisher/upload
  dependencies:
    - build_gluesync_core_hub
  interruptible: true

deploy_gluesync_core_hub:
  stage: deploy
  retry: 2
  tags:
    - hq-linux-docker
  image: docker:27.3.1
  rules:
    - if: '$PIPELINE_TYPE == "build_and_deploy" && $MODULE == "core-hub"'
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
  script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
    - sh scripts/docker-build.sh --tag=core-hub --module-version=$MODULE_VERSION --release-type=$RELEASE_TYPE --supported-deploy-arch=DEPLOY_AMD64_ARM64
  dependencies:
    - build_gluesync_core_hub
  interruptible: true

deploy_gluesync_windows_core_hub:
