stages:
  - deploy

default:
  tags:
    - gs-runners-hq

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_REGION: us-east-1
  STACK_NAME: dbmoto-xml-converter
  RESULTS_BUCKET_PREFIX: gluesync-conversion-results

deploy:
  stage: deploy
  image: docker:latest
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Building & deploying started..."

    - apk add --no-cache bash git
    
    # Initialize and update the Git submodule
    - git submodule init
    - git submodule update

    - 
      | 
      MODULE_NAME=${CI_COMMIT_TAG#tag-}  # Removes everything before "tag-"
      MODULE_NAME=${MODULE_NAME%-v*}  # Removes everything after the last "-"

      TAGPART=`echo $CI_COMMIT_TAG | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)'`

      DEFAULT_NAME=${DOCKER_REGISTRY}/${APP_NAME}
      ADDITIONAL_TAG="${DEFAULT_NAME}:${TAGPART}"

    - docker login -u danieleangeli -p "$CI_REGISTRY_PASSWORD"
    - docker build -t $DEFAULT_NAME:latest .
    - docker tag $DEFAULT_NAME:latest "$ADDITIONAL_TAG"
    - docker push "$ADDITIONAL_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^tag-/

# Deploy Lambda function on changes to dbmoto-converter or related files
deploy_lambda:
  stage: deploy
  image: python:3.9
  rules:
    - if: $CI_COMMIT_TAG =~ /^dbmoto-/
      when: always
  script:
    - echo "🚀 Starting Lambda deployment..."
    - cd dbmoto-converter
    - apt-get update && apt-get install -y awscli jq curl zip
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set region $AWS_REGION
    - export RESULTS_BUCKET="${RESULTS_BUCKET_PREFIX}-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - echo "📦 Creating Lambda deployment package..."
    - pip install -r requirements.txt -t lambda-package/ --quiet
    - cp ../parse_dbmoto_metadata_xml.py lambda-package/
    - cp ../table-list-template-basic.yaml lambda-package/ 2>/dev/null || true
    - cp lambda_function.py lambda-package/
    - cd lambda-package && zip -r ../lambda-package.zip . -q && cd ..
    - |
      if aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
        STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text)
        echo "📊 Current stack status: $STACK_STATUS"
        
        if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
          echo "🗑️  Stack is in ROLLBACK_COMPLETE state, deleting it first..."
          aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$AWS_REGION"
          echo "⏳ Waiting for stack deletion..."
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" --region "$AWS_REGION"
          echo "🆕 Creating new stack..."
          export OPERATION="create-stack"
          export WAIT_OPERATION="stack-create-complete"
        elif [[ "$STACK_STATUS" == *"IN_PROGRESS"* ]]; then
          echo "⏳ Stack is currently in progress ($STACK_STATUS), waiting for it to complete or fail..."
          WAIT_START=$(date +%s)
          TIMEOUT=600
          while true; do
            CURRENT_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text)
            ELAPSED=$(($(date +%s) - WAIT_START))
            echo "⏱️  Status: $CURRENT_STATUS (${ELAPSED}s elapsed)"
            
            if [[ "$CURRENT_STATUS" != *"IN_PROGRESS"* ]]; then
              echo "✅ Stack operation completed with status: $CURRENT_STATUS"
              STACK_STATUS="$CURRENT_STATUS"
              break
            fi
            
            if [ $ELAPSED -gt $TIMEOUT ]; then
              echo "❌ Timeout waiting for stack operation to complete"
              echo "🗑️  Canceling and deleting stack..."
              aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$AWS_REGION"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" --region "$AWS_REGION"
              export OPERATION="create-stack"
              export WAIT_OPERATION="stack-create-complete"
              break
            fi
            sleep 15
          done
          
          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "❌ Previous operation failed with ROLLBACK_COMPLETE"
            echo "📋 Failure details:"
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --max-items 30 \
              --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`ROLLBACK_IN_PROGRESS`].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
              --output table
            echo "🗑️  Deleting failed stack..."
            aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$AWS_REGION"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" --region "$AWS_REGION"
            export OPERATION="create-stack"
            export WAIT_OPERATION="stack-create-complete"
          elif [[ "$STACK_STATUS" == *"COMPLETE"* ]]; then
            echo "🔄 Stack exists and is stable, will update..."
            export OPERATION="update-stack"
            export WAIT_OPERATION="stack-update-complete"
          fi
        elif [[ "$STACK_STATUS" == *"COMPLETE"* ]] && [ "$STACK_STATUS" != "ROLLBACK_COMPLETE" ]; then
          echo "🔄 Updating existing stack..."
          export OPERATION="update-stack"
          export WAIT_OPERATION="stack-update-complete"
        else
          echo "⚠️  Unexpected stack status: $STACK_STATUS"
          echo "🗑️  Deleting stack to start fresh..."
          aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$AWS_REGION"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" --region "$AWS_REGION"
          export OPERATION="create-stack"
          export WAIT_OPERATION="stack-create-complete"
        fi
      else
        echo "🆕 Creating new stack..."
        export OPERATION="create-stack"
        export WAIT_OPERATION="stack-create-complete"
      fi
    - echo "☁️ Deploying CloudFormation stack..."
    - ls -la cloudformation-template.yaml || echo "CloudFormation template not found!"
    - |
      TEMPLATE_BODY=$(cat cloudformation-template.yaml)
      aws cloudformation "$OPERATION" \
        --stack-name "$STACK_NAME" \
        --template-body "$TEMPLATE_BODY" \
        --parameters ParameterKey=ResultsBucketName,ParameterValue="$RESULTS_BUCKET" \
        --capabilities CAPABILITY_IAM \
        --region "$AWS_REGION"
    - echo "⏳ Waiting for Lambda function to be created (max 5 minutes)..."
    - |
      WAIT_START=$(date +%s)
      TIMEOUT=300
      while true; do
        if aws lambda get-function --function-name dbmoto-xml-converter --region "$AWS_REGION" >/dev/null 2>&1; then
          echo "✅ Lambda function exists, updating code..."
          break
        fi
        ELAPSED=$(($(date +%s) - WAIT_START))
        if [ $ELAPSED -gt $TIMEOUT ]; then
          echo "❌ Timeout waiting for Lambda function"
          exit 1
        fi
        echo "⏱️  Waiting for Lambda... (${ELAPSED}s elapsed)"
        sleep 10
      done
    - echo "📦 Updating Lambda function code..."
    - |
      aws lambda update-function-code \
        --function-name dbmoto-xml-converter \
        --zip-file fileb://lambda-package.zip \
        --region "$AWS_REGION"
    - echo "⏳ Waiting for Lambda update to complete..."
    - aws lambda wait function-updated --function-name dbmoto-xml-converter --region "$AWS_REGION"
    - echo "⏳ Checking stack status before waiting..."
    - |
      CURRENT_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text)
      echo "📊 Current stack status: $CURRENT_STATUS"
      
      if [[ "$CURRENT_STATUS" == "CREATE_COMPLETE" ]] || [[ "$CURRENT_STATUS" == "UPDATE_COMPLETE" ]]; then
        echo "✅ Stack is already complete, skipping wait!"
      elif [[ "$CURRENT_STATUS" == *"FAILED"* ]] || [[ "$CURRENT_STATUS" == "ROLLBACK_COMPLETE" ]]; then
        echo "❌ Stack is in failed state: $CURRENT_STATUS"
        aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --region "$AWS_REGION" --max-items 10 --output table
        exit 1
      else
        echo "⏳ Waiting for stack deployment (status: $CURRENT_STATUS)..."
        if [ "$OPERATION" = "create-stack" ]; then
          timeout 600 aws cloudformation wait stack-create-complete --stack-name "$STACK_NAME" --region "$AWS_REGION" || {
          EXIT_CODE=$?
          echo "❌ Stack creation failed or timed out (exit code: $EXIT_CODE)"
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text)
          echo "📊 Final stack status: $STACK_STATUS"
          echo ""
          echo "📋 Failed resources and reasons:"
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --max-items 50 \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`ROLLBACK_IN_PROGRESS`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]' \
            --output table
          echo ""
          echo "📋 All recent events:"
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --max-items 20 \
            --output table
          exit 1
        }
      else
        timeout 600 aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME" --region "$AWS_REGION" || {
          EXIT_CODE=$?
          echo "❌ Stack update failed or timed out (exit code: $EXIT_CODE)"
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text)
          echo "📊 Final stack status: $STACK_STATUS"
          echo ""
          echo "📋 Failed resources and reasons:"
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --max-items 50 \
            --query 'StackEvents[?ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`UPDATE_ROLLBACK_IN_PROGRESS`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]' \
            --output table
          echo ""
          echo "📋 All recent events:"
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --max-items 20 \
            --output table
          exit 1
        }
        fi
      fi
    - echo "✅ Stack deployment completed!"
    - |
      API_ENDPOINT=$(aws cloudformation describe-stacks \
        --stack-name "$STACK_NAME" \
        --region "$AWS_REGION" \
        --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
        --output text)
      RESULTS_BUCKET_NAME=$(aws cloudformation describe-stacks \
        --stack-name "$STACK_NAME" \
        --region "$AWS_REGION" \
        --query 'Stacks[0].Outputs[?OutputKey==`ResultsBucketName`].OutputValue' \
        --output text)
      echo "API_ENDPOINT=$API_ENDPOINT" >> deploy.env
      echo "RESULTS_BUCKET_NAME=$RESULTS_BUCKET_NAME" >> deploy.env
    - |
      echo "🧪 Testing API endpoint..."
      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$API_ENDPOINT/convert" -X POST 2>/dev/null || echo "000")
      if [ "$RESPONSE" = "400" ] || [ "$RESPONSE" = "000" ]; then
        echo "✅ API endpoint responding (400 expected for missing file, 000 for network issues)"
      else
        echo "⚠️  API endpoint returned unexpected status: $RESPONSE"
        exit 1
      fi

  artifacts:
    reports:
      dotenv: deploy.env
    paths:
      - lambda-package.zip
    expire_in: 1 week

  environment:
    name: production
    url: $API_ENDPOINT

# Deploy WordPress plugin to hosting
deploy_wordpress_plugin:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^dbmoto-/
      when: always
  dependencies:
    - deploy_lambda
  script:
    - echo "🚀 Deploying WordPress plugin to hosting..."
    - apk add --no-cache lftp
    - cd dbmoto-converter/wordpress-plugin/dbmoto-converter
    - echo "📤 Uploading plugin files to WordPress hosting..."
    - lftp -c "open -u $FTP_USER,$FTP_PASSWORD ftp://$FTP_SITE; mirror -R . /molo17.com/public_html/wp-content/plugins/dbmoto-converter/"
    - echo "✅ WordPress plugin deployed successfully!"
  when: manual
  allow_failure: true

# Manual cleanup job
cleanup_lambda:
  stage: deploy
  image: amazon/aws-cli:latest
  when: manual
  only:
    - web
  script:
    - echo "🧹 Cleaning up Lambda deployment..."
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set region $AWS_REGION
    - aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$AWS_REGION"
    - echo "⏳ Waiting for stack deletion..."
    - aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" --region "$AWS_REGION"
    - echo "✅ Lambda deployment cleaned up successfully"
