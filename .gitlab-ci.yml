stages:
  - build
  - deploy

default:
  tags:
    - gs-runners-hq

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_REGION: us-east-1
  STACK_NAME: dbmoto-xml-converter
  RESULTS_BUCKET_PREFIX: gluesync-conversion-results
  HOSTED_ZONE_ID: ""  # Route 53 hosted zone ID for molo17.com - set in GitLab CI/CD variables

automator_build:
  stage: build
  image: python:3.9-bullseye
  rules:
    - if: $CI_COMMIT_TAG =~ /^automator-\d+\.\d+\.\d+.*$/
      when: always
    - when: never
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  before_script:
    - python3 --version
    - pip3 install --break-system-packages --upgrade pip
    - pip3 install --break-system-packages -r requirements.txt pyinstaller
  script:
    - |
      export AUTOMATOR_VERSION="${CI_COMMIT_TAG#automator-}"
      echo "Building Gluesync Automator version $AUTOMATOR_VERSION for Linux"
      pyinstaller automator-linux.spec --clean --distpath .automator-build/dist --workpath .automator-build/build
    - ls -la .automator-build/dist
  artifacts:
    name: "gluesync-automator-linux-${CI_COMMIT_TAG}"
    paths:
      - .automator-build/dist/gluesync-automator-linux
    expire_in: 2 weeks

automator_build_windows:
  stage: build
  tags:
    - hq-windows-shell-2022
  rules:
    - if: $CI_COMMIT_TAG =~ /^automator-\d+\.\d+\.\d+.*$/
      when: always
    - when: never
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  before_script:
    - |
      $ErrorActionPreference = 'Stop'
      $pythonDir = Join-Path $env:CI_PROJECT_DIR 'python'
      New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
      $pythonZip = Join-Path $pythonDir 'python.zip'
      Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $pythonZip
      Expand-Archive -Path $pythonZip -DestinationPath $pythonDir -Force
      Remove-Item $pythonZip
      $pthFile = Join-Path $pythonDir 'python311._pth'
      (Get-Content $pthFile) -replace '#import site', 'import site' | Set-Content $pthFile
      $getPip = Join-Path $pythonDir 'get-pip.py'
      Invoke-WebRequest -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
      & (Join-Path $pythonDir 'python.exe') $getPip
      & (Join-Path $pythonDir 'python.exe') -m pip install --upgrade pip
      & (Join-Path $pythonDir 'python.exe') -m pip install pyinstaller
      & (Join-Path $pythonDir 'python.exe') -m pip install -r (Join-Path $env:CI_PROJECT_DIR 'requirements.txt')
      $env:Path = "$pythonDir;$env:Path"
  script:
    - |
      $python = Join-Path $env:CI_PROJECT_DIR 'python\python.exe'
      $version = $env:CI_COMMIT_TAG -replace '^automator-', ''
      Write-Host "Building Gluesync Automator version $version for Windows"
      & $python -m PyInstaller automator-windows.spec --clean --distpath .automator-build/dist --workpath .automator-build/build
    - Get-ChildItem .automator-build/dist
  artifacts:
    name: "gluesync-automator-windows-${CI_COMMIT_TAG}"
    paths:
      - .automator-build/dist/gluesync-automator-windows.exe
    expire_in: 2 weeks

