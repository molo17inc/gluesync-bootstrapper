  rules:
    - if: '$PIPELINE_TYPE == "build_and_deploy" && $MODULE == "db2-luw-triggers"'
  script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
    - mkdir libs
    - gradle :db2-luw:triggers:obfuscateWithProguard
    - find . -type f -name gluesync-*.jar -path '*/build/*' -exec cp '{}' libs/ \;
  artifacts:
    paths:
      - libs/*
    expire_in: 1 day
  interruptible: true

publish_gluesync_db2_luw_triggers:
  stage: publish
  retry: 2
  tags:
    - hq-linux-docker
  rules:
    - if: '$PIPELINE_TYPE == "build_and_deploy" && $MODULE == "db2-luw-triggers"'
  script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
    - apt-get update && apt-get install -y gnupg zip curl
    - echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
    - |
      if [ -z "$MODULE_VERSION" ]; then
        echo "MODULE_VERSION is not set. Ensure the pipeline is triggered with module version." >&2
        exit 1
      fi
      export VERSION="$MODULE_VERSION"
    - RELEASE_VERSION="$VERSION" gradle -Psigning.gnupg.keyName="$GPG_KEY_ID" -Psigning.gnupg.passphrase="$GPG_PASSPHRASE" :db2-luw:triggers:publishToMavenLocal
    - ARTIFACT_DIR="${HOME}/.m2/repository/com/molo17/gluesync/gluesync-db2-luw-triggers/$VERSION"
    - |
      if [ ! -d "$ARTIFACT_DIR" ]; then
        echo "Artifacts not found in $ARTIFACT_DIR" >&2
        exit 1
      fi
    - mkdir -p /tmp/bundle/com/molo17/gluesync/gluesync-db2-luw-triggers/$VERSION
    - cp $ARTIFACT_DIR/* /tmp/bundle/com/molo17/gluesync/gluesync-db2-luw-triggers/$VERSION/
    - cd /tmp/bundle/com/molo17/gluesync/gluesync-db2-luw-triggers/$VERSION
    - |
      for file in *.jar *.pom; do
        if [ -f "$file" ]; then
          md5sum "$file" | awk '{print $1}' > "${file}.md5"
          sha1sum "$file" | awk '{print $1}' > "${file}.sha1"
        fi
      done
    - cd /tmp/bundle && zip -r /tmp/gluesync-db2-luw-triggers-bundle.zip com/
    - export AUTH_TOKEN=$(printf "${SONATYPE_USERNAME}:${SONATYPE_PASSWORD}" | base64)
    - |
      curl --fail --request POST \
        --header "Authorization: Bearer ${AUTH_TOKEN}" \
        --form bundle=@/tmp/gluesync-db2-luw-triggers-bundle.zip \
        --form publishingType=AUTOMATIC \
        https://central.sonatype.com/api/v1/publisher/upload
  dependencies:
    - build_gluesync_db2_luw_triggers
  interruptible: true

