stages:
  - validate
  - fetch-agents
  - build
  - build-sonar
  - deploy

default:
  tags:
    - gs-runners-hq

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_REGION: us-east-1
  STACK_NAME: dbmoto-xml-converter
  RESULTS_BUCKET_PREFIX: gluesync-conversion-results
  HOSTED_ZONE_ID: ""
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

# Run syntax check on every commit to catch PyInstaller issues early
pyinstaller_syntax_check:
  stage: validate
  image: python:3.11-bullseye
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG =~ /^automator-\d+\.\d+\.\d+.*$/
      when: always
    - when: never
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  before_script:
    - python3 --version
    - pip3 install --break-system-packages --upgrade pip
    - pip3 install --break-system-packages -r requirements.txt
  script:
    - echo "Running PyInstaller compatibility syntax check..."
    - python3 integration-tests/test_pyinstaller_compatibility.py --quick-check
    - echo "Running full unit test suite..."
    - python3 -m unittest integration-tests.test_pyinstaller_compatibility -v
  allow_failure: false

# Run DbMoto converter unit tests
dbmoto_converter_tests:
  stage: validate
  image: python:3.11-bullseye
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG =~ /^dbmoto-/
      when: always
    - when: never
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  before_script:
    - python3 --version
    - pip3 install --break-system-packages --upgrade pip
    - cd dbmoto-converter
    - pip3 install --break-system-packages -r requirements.txt pyyaml
  script:
    - echo "Running DbMoto converter unit tests..."
    - python3 -m unittest discover tests -v
  allow_failure: false

bootstrapper_core_unit_tests:
  stage: validate
  image: python:3.11-bullseye
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG =~ /^automator-\d+\.\d+\.\d+.*$/
      when: always
    - when: never
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  before_script:
    - python3 --version
    - pip3 install --break-system-packages --upgrade pip
    - pip3 install --break-system-packages -r requirements.txt
  script:
    - echo "Running bootstrapper core YAML payload unit tests..."
    - python3 -m unittest discover integration-tests -p 'test_bootstrapper_*.py' -v
  allow_failure: false

automator_smoke_linux:
  stage: validate
  image: python:3.11-bullseye
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG =~ /^automator-\d+\.\d+\.\d+.*$/
      when: always
    - when: never
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  before_script:
    - python3 --version
    - pip3 install --break-system-packages --upgrade pip
    - pip3 install --break-system-packages -r requirements.txt
  script:
    - |
      set -euo pipefail
      PORT=18080
      LOG_FILE="automator-smoke-linux.log"
      python3 run_automator.py --host 127.0.0.1 --port "$PORT" --no-open-browser >"$LOG_FILE" 2>&1 &
      APP_PID=$!
      cleanup() {
        kill "$APP_PID" >/dev/null 2>&1 || true
        wait "$APP_PID" >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      python3 - "$PORT" <<'PY'
        import sys
        import time
        import urllib.error
        import urllib.request

        port = int(sys.argv[1])
        base_url = f"http://127.0.0.1:{port}"
        deadline = time.time() + 90
        last_error = None

        while time.time() < deadline:
            try:
                with urllib.request.urlopen(f"{base_url}/api/healthz", timeout=2) as response:
                    body = response.read().decode("utf-8")
                    if response.status == 200 and '"status": "ok"' in body:
                        break
            except (urllib.error.URLError, TimeoutError, OSError) as exc:
                last_error = exc
                time.sleep(1)
        else:
            print(f"Timed out waiting for {base_url}/api/healthz: {last_error}", file=sys.stderr)
            raise SystemExit(1)

        with urllib.request.urlopen(f"{base_url}/", timeout=2) as response:
            if response.status != 200:
                raise SystemExit(f"Root endpoint returned HTTP {response.status}")
            if "text/html" not in response.headers.get_content_type():
                raise SystemExit("Root endpoint did not return HTML")
      PY
      echo "Automator smoke test passed on Linux"

automator_smoke_windows:
  stage: validate
  tags:
    - hq-windows-shell-2022
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG =~ /^automator-\d+\.\d+\.\d+.*$/
      when: always
    - when: never
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  before_script:
    - |
      $ErrorActionPreference = 'Stop'
      $pythonDir = Join-Path $env:CI_PROJECT_DIR 'python'
      New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
      $pythonZip = Join-Path $pythonDir 'python.zip'
      Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $pythonZip
      Expand-Archive -Path $pythonZip -DestinationPath $pythonDir -Force
      Remove-Item $pythonZip
      $pthFile = Join-Path $pythonDir 'python311._pth'
      (Get-Content $pthFile) -replace '#import site', 'import site' | Set-Content $pthFile
      $getPip = Join-Path $pythonDir 'get-pip.py'
      Invoke-WebRequest -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
      & (Join-Path $pythonDir 'python.exe') $getPip
      & (Join-Path $pythonDir 'python.exe') -m pip install --upgrade pip
      & (Join-Path $pythonDir 'python.exe') -m pip install -r (Join-Path $env:CI_PROJECT_DIR 'requirements.txt')
      $env:Path = "$pythonDir;$env:Path"
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $port = 18081
      $logFile = Join-Path $env:CI_PROJECT_DIR 'automator-smoke-windows.log'
      $python = Join-Path $env:CI_PROJECT_DIR 'python\python.exe'
      $process = Start-Process -FilePath $python -WorkingDirectory $env:CI_PROJECT_DIR -ArgumentList @(
        'run_automator.py',
        '--host', '127.0.0.1',
        '--port', "$port",
        '--no-open-browser'
      ) -RedirectStandardOutput $logFile -RedirectStandardError $logFile -PassThru

      try {
        $deadline = (Get-Date).AddSeconds(90)
        $healthOk = $false

        while ((Get-Date) -lt $deadline) {
          try {
            $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/api/healthz" -TimeoutSec 2
            if ($response.StatusCode -eq 200 -and $response.Content -match '"status"' -and $response.Content -match '"ok"') {
              $healthOk = $true
              break
            }
          } catch {
            Start-Sleep -Seconds 1
          }
        }

        if (-not $healthOk) {
          throw "Timed out waiting for http://127.0.0.1:$port/api/healthz"
        }

        $root = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/" -TimeoutSec 2
        if ($root.StatusCode -ne 200) {
          throw "Root endpoint returned HTTP $($root.StatusCode)"
        }

        Write-Host "Automator smoke test passed on Windows"
      }
      finally {
        if (-not $process.HasExited) {
          Stop-Process -Id $process.Id -Force
        }
      }

fetch_agents:
  stage: fetch-agents
  image: python:3.11-bullseye
  rules:
    - if: $CI_COMMIT_TAG =~ /^automator-\d+\.\d+\.\d+.*$/
      when: always
    - if: "$CI_COMMIT_TAG =~ /^tag-/"
      when: always
    - if: "$CI_COMMIT_TAG =~ /^beta-/"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  before_script:
    - python3 --version
    - pip3 install --break-system-packages --upgrade pip
    - pip3 install --break-system-packages requests
  script:
    - echo "Fetching latest agents data..."
    - python3 scripts/fetch-agents.py
    - echo "Using fetched agents.json as pipeline artifact"
  artifacts:
    paths:
      - agents.json
    expire_in: 1 day
  allow_failure: false

automator_build:
  stage: build
  image: python:3.11-bullseye
  needs:
    - job: fetch_agents
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^automator-\d+\.\d+\.\d+.*$/
      when: always
    - when: never
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  before_script:
    - python3 --version
    - pip3 install --break-system-packages --upgrade pip
    - pip3 install --break-system-packages -r requirements.txt pyinstaller
  script:
    - |
      export AUTOMATOR_VERSION="${CI_COMMIT_TAG#automator-}"
      echo "Building Gluesync Automator version $AUTOMATOR_VERSION for Linux"
      echo "$AUTOMATOR_VERSION" > automator_app/VERSION
      pyinstaller automator-linux.spec --clean --distpath .automator-build/dist --workpath .automator-build/build
    - ls -la .automator-build/dist
  artifacts:
    name: "gluesync-automator-linux-${CI_COMMIT_TAG}"
    paths:
      - .automator-build/dist/gluesync-automator-linux
    expire_in: 2 weeks

automator_build_windows:
  stage: build
  tags:
    - hq-windows-shell-2022
  needs:
    - job: fetch_agents
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^automator-\d+\.\d+\.\d+.*$/
      when: always
    - when: never
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  before_script:
    - |
      $ErrorActionPreference = 'Stop'
      $pythonDir = Join-Path $env:CI_PROJECT_DIR 'python'
      New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
      $pythonZip = Join-Path $pythonDir 'python.zip'
      Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $pythonZip
      Expand-Archive -Path $pythonZip -DestinationPath $pythonDir -Force
      Remove-Item $pythonZip
      $pthFile = Join-Path $pythonDir 'python311._pth'
      (Get-Content $pthFile) -replace '#import site', 'import site' | Set-Content $pthFile
      $getPip = Join-Path $pythonDir 'get-pip.py'
      Invoke-WebRequest -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
      & (Join-Path $pythonDir 'python.exe') $getPip
      & (Join-Path $pythonDir 'python.exe') -m pip install --upgrade pip
      & (Join-Path $pythonDir 'python.exe') -m pip install pyinstaller
      & (Join-Path $pythonDir 'python.exe') -m pip install -r (Join-Path $env:CI_PROJECT_DIR 'requirements.txt')
      $env:Path = "$pythonDir;$env:Path"
  script:
    - |
      $python = Join-Path $env:CI_PROJECT_DIR 'python\python.exe'
      $version = $env:CI_COMMIT_TAG -replace '^automator-', ''
      Write-Host "Building Gluesync Automator version $version for Windows"
      Set-Content -Path (Join-Path $env:CI_PROJECT_DIR 'automator_app\VERSION') -Value $version
      & $python -m PyInstaller automator-windows.spec --clean --distpath .automator-build/dist --workpath .automator-build/build
    - Get-ChildItem .automator-build/dist
  artifacts:
    name: "gluesync-automator-windows-${CI_COMMIT_TAG}"
    paths:
      - .automator-build/dist/gluesync-automator-windows.exe
    expire_in: 2 weeks

