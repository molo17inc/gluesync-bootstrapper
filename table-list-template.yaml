schemas:
  dbo:
    target: public
    customProperties:
      source: 
        maxItemsCountPerIteration: 1000
        pollingIntervalMilliseconds: 100
      target:
        ttlValue: 10000000
    tables:
      whitelist:
        - DRIVERS
        - VEHICLES
      custom:
        DRIVERS:
          keys: 
            - ID
          documentKey:
            prefix: "TESTPREFIX"
            suffix: "TESTSUFFIX"
            separator: "-"
            keys: 
              - ID
              - LAST_NAME
          name: drivers
          columns:
            - FIRST_NAME: firstName
            - LAST_NAME: lastName
          # New filter configuration
          filter:
            clauses:
              - column: GENDER
                type: string  # Specify the column type for proper mapping
                operation: Equal
                value: "Female"
              - column: AGE
                type: int
                operation: GreaterEqual
                value: 21
              - column: DRIVING_LICENSE_EXPIRE_DATE
                type: string
                operation: IsNotNull
              - column: EMAIL
                type: string
                operation: Regex
                value: ".*@company\\.com"
          customProperties:
            target:
              ttlValue: 20000000
        
        VEHICLES:
          keys:
            - VEHICLE_ID
          name: vehicles
          filter:
            clauses:
              - column: REGISTRATION_DATE
                type: string
                operation: Greater
                value: "2020-01-01"
              - column: STATUS
                type: string
                operation: In
                value: ["ACTIVE", "MAINTENANCE"]