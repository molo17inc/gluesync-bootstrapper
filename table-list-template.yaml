schemas:
  dbo:
    target: public
    customProperties:
      source: 
        maxItemsCountPerIteration: 1000
        pollingIntervalMilliseconds: 100
      target:
        ttlValue: 10000000
    # Optional pipeline-level schedule configurations
    schedules:
      # Pipeline start schedule (runs on weekdays at 7:00 AM)
      - name: "Daily pipeline startup"
        description: "Start the entire pipeline every weekday morning"
        task_type: "pipeline_start"  # pipeline_start, pipeline_stop, pipeline_snapshot
        schedule:
          days_of_week: ["monday", "tuesday", "wednesday", "thursday", "friday"]
          hour: 7
          minute: 0
        # Alternatively, you can use cron expression:
        # cron_expression: "0 7 * * 1-5"
        with_snapshot: false
        enabled: true
    tables:
      whitelist:
        - DRIVERS
        - VEHICLES
      custom:
        DRIVERS:
          keys:
            - ID:
                name: id
          documentKey:
            prefix: "TESTPREFIX"
            suffix: "TESTSUFFIX"
            separator: "-"
            keys: 
              - ID
              - LAST_NAME
          name: drivers
          groupId: "_default"
          columns:
            - FIRST_NAME:
                name: firstName
                type: varchar(50)
            - LAST_NAME:
                name: lastName
                type: varchar(100)
            - AGE:
                name: age
                type: int
            - DRIVING_LICENSE_EXPIRE_DATE:
                name: licenseExpiry
                type: datetime
            - EMAIL:
                name: email
                type: varchar(255)
          # Entity-level schedule configurations
          schedules:
            # First schedule for entity (runs every day at midnight)
            - name: "Daily driver data snapshot"
              description: "Create snapshot of driver data daily at midnight"
              task_type: "entity_snapshot"  # entity_start, entity_stop, entity_snapshot
              cron_expression: "0 0 * * *"  # Every day at midnight
              enabled: true
            # Second schedule for entity (runs on weekends at 2:00 AM)
            - name: "Weekend driver data refresh"
              description: "Restart driver entity every weekend for data refresh"
              task_type: "entity_start"  # entity_start, entity_stop, entity_snapshot
              schedule:
                days_of_week: ["saturday", "sunday"]
                hour: 2
                minute: 0
              with_snapshot: true
              enabled: true
          # New filter configuration
          filter:
            clauses:
              - column: GENDER
                type: string  # Specify the column type for proper mapping
                operation: Equal
                value: "Female"
              - column: AGE
                type: int
                operation: GreaterEqual
                value: 21
              - column: DRIVING_LICENSE_EXPIRE_DATE
                type: string
                operation: IsNotNull
              - column: EMAIL
                type: string
                operation: Regex
                value: ".*@company\\.com"
          customProperties:
            target:
              ttlValue: 20000000
              udf: # User defined functions
                - name: UPPERCASE_DRIVERS
                  type: java
          
        VEHICLES:
          groupId: "finance"
          keys:
            - VEHICLE_ID
          name: vehicles
          columns:
            - VEHICLE_ID:
                name: id
                type: varchar(36)
            - MODEL:
                name: model
                type: varchar(100)
            - YEAR:
                name: year
                type: int
            - REGISTRATION_DATE:
                name: registrationDate
                type: datetime
          # Entity-level schedule configurations
          schedules:
            - name: "Weekly vehicles snapshot"
              description: "Create a snapshot of vehicle data every Sunday at 1:00 AM"
              task_type: "entity_snapshot"
              schedule:
                days_of_week: ["sunday"]
                hour: 1
                minute: 0
              enabled: true
          filter:
            clauses:
              - column: REGISTRATION_DATE
                type: string
                operation: Greater
                value: "2020-01-01"
              - column: STATUS
                type: string
                operation: In
                value: ["ACTIVE", "MAINTENANCE"]
                
        # MultiTable entity example with chainId
        # The following tables will be combined into a single MultiTable entity
        ORDERS_HEADERS:
          chainId: "orders_chain"  # Tables with the same chainId will be combined into a MultiTable entity
          orderIndex: 0  # Order index for this entity in the chain (default: 0 if not specified)
          groupId: "sales"
          keys:
            - ID
          name: orders_headers
          columns:
            - ID:
                name: id
                type: int
            - ORDER_NUMBER:
                name: orderNumber
                type: varchar(50)
            - ORDER_DATE:
                name: orderDate
                type: varchar(50)
            - STATUS:
                name: status
                type: int
            - CUSTOMER_ID:
                name: customerId
                type: int
            - ADDRESS_ID:
                name: addressId
                type: int
            - NOTES:
                name: notes
                type: varchar(255)
            - DRIVER_ID:
                name: driverId
                type: int
          customProperties:
            source:
              maxItemsCountPerIteration: 1000
              pollingIntervalMilliseconds: 100
            target:
              ttlValue: 0
              
        ORDERS_ROWS:
          chainId: "orders_chain"  # Same chainId as ORDERS_HEADERS to be included in the same MultiTable
          orderIndex: 1  # Order index for this entity in the chain (default: 0 if not specified)
          groupId: "sales"
          keys:
            - ID
          name: orders_rows
          columns:
            - ID:
                name: id
                type: int
            - ARTICLE_ID:
                name: articleId
                type: int
            - QUANTITY:
                name: quantity
                type: int
            - ORDER_ID:
                name: orderId
                type: int
            - NOTES:
                name: notes
                type: varchar(255)
          customProperties:
            source:
              maxItemsCountPerIteration: 1000
              pollingIntervalMilliseconds: 100
            target:
              ttlValue: 0