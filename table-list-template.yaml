schemas:
  dbo:
    target: public
    customProperties:
      source: 
        maxItemsCountPerIteration: 1000
        pollingIntervalMilliseconds: 100
      target:
        ttlValue: 10000000
    tables:
      whitelist:
        - DRIVERS
        - VEHICLES
      custom:
        DRIVERS:
          keys: 
            - ID
          documentKey:
            prefix: "TESTPREFIX"
            suffix: "TESTSUFFIX"
            separator: "-"
            keys: 
              - ID
              - LAST_NAME
          name: drivers
          columns:
            - FIRST_NAME:
                name: firstName
                type: varchar(50)
            - LAST_NAME:
                name: lastName
                type: varchar(100)
            - AGE:
                name: age
                type: int
            - DRIVING_LICENSE_EXPIRE_DATE:
                name: licenseExpiry
                type: datetime
            - EMAIL:
                name: email
                type: varchar(255)
          # New filter configuration
          filter:
            clauses:
              - column: GENDER
                type: string  # Specify the column type for proper mapping
                operation: Equal
                value: "Female"
              - column: AGE
                type: int
                operation: GreaterEqual
                value: 21
              - column: DRIVING_LICENSE_EXPIRE_DATE
                type: string
                operation: IsNotNull
              - column: EMAIL
                type: string
                operation: Regex
                value: ".*@company\\.com"
          customProperties:
            target:
              ttlValue: 20000000
        
        VEHICLES:
          keys:
            - VEHICLE_ID
          name: vehicles
          columns:
            - VEHICLE_ID:
                name: id
                type: varchar(36)
            - MODEL:
                name: model
                type: varchar(100)
            - YEAR:
                name: year
                type: int
            - REGISTRATION_DATE:
                name: registrationDate
                type: datetime
          filter:
            clauses:
              - column: REGISTRATION_DATE
                type: string
                operation: Greater
                value: "2020-01-01"
              - column: STATUS
                type: string
                operation: In
                value: ["ACTIVE", "MAINTENANCE"]