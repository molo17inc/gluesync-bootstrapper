sonar.projectKey=molo17-public_gluesync_gluesync-bootstrapper_422821b0-a562-4286-a737-066ee5d2ee88
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=integration-tests
sonar.test.inclusions=integration-tests/**
sonar.python.version=3.11

# Exclude generated files, import packages, large XMLs, and build artifacts from analysis
sonar.exclusions=udf_import_package/**,efcocrp-meta.xml,gstest.xml,backup_*.yaml,*.spec,.automator-build/**,.sonar/**

# Exclude third-party data and sample packages from CPD duplicate code detection
sonar.cpd.exclusions=integration-tests/**,udf_import_package/**

# Coverage exclusions (no coverage reports are published in CI)
sonar.coverage.exclusions=**/*
