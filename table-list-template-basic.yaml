schemas:
  dbo:
    target: public
    customProperties:
      source: 
        maxItemsCountPerIteration: 1000
    tables:
      whitelist:
        - DRIVERS
        - VEHICLES
      custom:
        DRIVERS:
          keys: 
            - ID
          documentKey:
            prefix: "TESTPREFIX"
            suffix: "TESTSUFFIX"
            separator: "-"
            keys: 
              - ID
              - LAST_NAME
          name: drivers
          columns:
            - FIRST_NAME: "firstName"
            - LAST_NAME: "lastName"
            - AGE: "age"
            - DRIVING_LICENSE_EXPIRE_DATE: "licenseExpiry"
            - EMAIL: "email"
          # Entity-level schedule configurations
          schedules:
            # First schedule for entity (runs every day at midnight)
            - name: "Daily driver data snapshot"
              description: "Create snapshot of driver data daily at midnight"
              task_type: "entity_snapshot"  # entity_start, entity_stop, entity_snapshot
              cron_expression: "0 0 * * *"  # Every day at midnight
              enabled: true
            # Second schedule for entity (runs on weekends at 2:00 AM)
            - name: "Weekend driver data refresh"
              description: "Restart driver entity every weekend for data refresh"
              task_type: "entity_start"  # entity_start, entity_stop, entity_snapshot
              schedule:
                days_of_week: ["saturday", "sunday"]
                hour: 2
                minute: 0
              with_snapshot: true
              enabled: true
          # New filter configuration
          filter:
            clauses:
              - column: GENDER
                type: string  # Specify the column type for proper mapping
                operation: Equal
                value: "Female"
              - column: AGE
                type: int
                operation: GreaterEqual
                value: 21
              - column: DRIVING_LICENSE_EXPIRE_DATE
                type: string
                operation: IsNotNull
              - column: EMAIL
                type: string
                operation: Regex
                value: ".*@company\\.com"
          # Snapshot delete filter example - preserves records matching the criteria
          snapshotDeleteFilter:
            clauses:
              - column: STATUS
                type: string
                operation: Equal
                value: "ARCHIVED"  # Archived records won't be deleted during snapshot
          # Snapshot write method - UPSERT or INSERT (default: UPSERT)
          snapshotWriteMethod: "UPSERT"
          customProperties:
            target:
              ttlValue: 20000000
              allowedOperations: ["INSERT", "UPDATE", "TRUNCATE"]
        
        VEHICLES:
          keys:
            - VEHICLE_ID
          name: vehicles
          columns:
            - VEHICLE_ID: "id"
            - MODEL: "model"
            - YEAR: "year"
            - REGISTRATION_DATE: "registrationDate"
          # Entity-level schedule configurations
          schedules:
            - name: "Weekly vehicles snapshot"
              description: "Create a snapshot of vehicle data every Sunday at 1:00 AM"
              task_type: "entity_snapshot"
              schedule:
                days_of_week: ["sunday"]
                hour: 1
                minute: 0
              enabled: true
          filter:
            clauses:
              - column: REGISTRATION_DATE
                type: string
                operation: Greater
                value: "2020-01-01"
              - column: STATUS
                type: string
                operation: In
                value: ["ACTIVE", "MAINTENANCE"]